name: Windows portable executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:portable
      - run: npm run build:sea
      - shell: pwsh
        run: ./scripts/smoke-sea.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FlowPlan2-windows-x64
          path: dist/FlowPlan2.exe
          if-no-files-found: error
